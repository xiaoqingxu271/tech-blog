# ============================================================
# Nginx 反向代理 + HTTPS（自托管方案）
# 放到 /etc/nginx/sites-available/tech-blog，然后：
#   ln -s /etc/nginx/sites-available/tech-blog /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# 证书先用 certbot --nginx -d blog.yourdomain.com 自动签发并改写本文件。
# ============================================================

upstream tech_blog {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.yourdomain.com;

    # certbot HTTP-01 校验路径
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/blog.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 文章正文可能较长（Markdown + 图片 base64）
    client_max_body_size 20m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Next.js 静态资源：带 hash，可永久缓存
    location /_next/static/ {
        proxy_pass http://tech_blog;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://tech_blog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;      # SSE / 热更新
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
